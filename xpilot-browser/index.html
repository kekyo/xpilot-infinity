<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>XPilot Infinity</title>
  </head>
  <body>
    <main>
      <h1>XPilot Infinity</h1>
      <output id="status" aria-live="polite">Loading game…</output>
      <form id="join" class="controls">
        <label
          >Name
          <input
            id="nickname"
            value="BrowserPilot"
            maxlength="24"
            required /></label
        ><button id="connect" disabled>Join game</button
        ><button id="disconnect" type="button" disabled>Leave game</button>
      </form>
      <output id="connection" aria-live="polite">Disconnected</output>
      <div class="controls">
        <label class="check"><input id="mute" type="checkbox" /> Mute</label>
        <button id="save" type="button">Save game settings</button>
        <button id="mouse" type="button">Mouse steering</button>
        <button id="fullscreen" type="button">Full screen</button>
      </div>
      <output id="settings" aria-live="polite"></output>
      <output id="audio" aria-live="polite">Audio ready</output>
      <div id="viewport">
        <canvas id="game" tabindex="0" aria-label="XPilot game"></canvas>
      </div>
      <form id="chat-form" class="controls">
        <label>Chat <input id="chat" maxlength="240" /></label
        ><button>Send</button>
      </form>
      <output id="chat-message" aria-live="polite"></output>
      <p>
        A / S: turn · Shift: thrust · Enter: fire · Space: shield. Click the
        game or page background to resume keyboard control. Use Mouse steering
        to steer with the mouse.
      </p>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
